name: Test Secrets Tag
on:
  push:
    tags: ['diag-v*']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: check
        env:
          A: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          B: ${{ secrets.DSH_ANDROID_KEYSTORE_PASSWORD }}
          C: ${{ secrets.DSH_ANDROID_KEY_ALIAS }}
          D: ${{ secrets.DSH_ANDROID_KEY_PASSWORD }}
        run: |
          for n in A B C D; do
            if [ -n "${!n}" ]; then echo "$n SET"; else echo "$n EMPTY"; fi
          done
